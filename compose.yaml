name: luna-period-tracker

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      PERIOD_TRACKER_DB: /app/data/period_tracker.db
      PERIOD_TRACKER_SESSION_DAYS: "${PERIOD_TRACKER_SESSION_DAYS:-30}"
      PERIOD_TRACKER_SECURE_COOKIE: "${PERIOD_TRACKER_SECURE_COOKIE:-false}"
      PERIOD_TRACKER_TRUST_PROXY: "true"
      PERIOD_TRACKER_LOGIN_ATTEMPTS: "${PERIOD_TRACKER_LOGIN_ATTEMPTS:-5}"
      PERIOD_TRACKER_LOGIN_WINDOW_SECONDS: "${PERIOD_TRACKER_LOGIN_WINDOW_SECONDS:-900}"
      PERIOD_TRACKER_RECOVERY_ATTEMPTS: "${PERIOD_TRACKER_RECOVERY_ATTEMPTS:-5}"
      PERIOD_TRACKER_RECOVERY_WINDOW_SECONDS: "${PERIOD_TRACKER_RECOVERY_WINDOW_SECONDS:-1800}"
      PERIOD_TRACKER_REGISTER_ATTEMPTS: "${PERIOD_TRACKER_REGISTER_ATTEMPTS:-10}"
      PERIOD_TRACKER_REGISTER_WINDOW_SECONDS: "${PERIOD_TRACKER_REGISTER_WINDOW_SECONDS:-3600}"
    volumes:
      - luna-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LUNA_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  luna-data:
