name: luna-period-tracker

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      PERIOD_TRACKER_DB: /app/data/period_tracker.db
      PERIOD_TRACKER_SESSION_DAYS: "${PERIOD_TRACKER_SESSION_DAYS:-30}"
      PERIOD_TRACKER_SECURE_COOKIE: "${PERIOD_TRACKER_SECURE_COOKIE:-false}"
      PERIOD_TRACKER_TRUST_PROXY: "true"
      PERIOD_TRACKER_LOGIN_ATTEMPTS: "${PERIOD_TRACKER_LOGIN_ATTEMPTS:-5}"
      PERIOD_TRACKER_LOGIN_WINDOW_SECONDS: "${PERIOD_TRACKER_LOGIN_WINDOW_SECONDS:-900}"
      PERIOD_TRACKER_RECOVERY_ATTEMPTS: "${PERIOD_TRACKER_RECOVERY_ATTEMPTS:-5}"
      PERIOD_TRACKER_RECOVERY_WINDOW_SECONDS: "${PERIOD_TRACKER_RECOVERY_WINDOW_SECONDS:-1800}"
      PERIOD_TRACKER_REGISTER_ATTEMPTS: "${PERIOD_TRACKER_REGISTER_ATTEMPTS:-10}"
      PERIOD_TRACKER_REGISTER_WINDOW_SECONDS: "${PERIOD_TRACKER_REGISTER_WINDOW_SECONDS:-3600}"
      PERIOD_TRACKER_VAPID_PUBLIC_KEY: "${PERIOD_TRACKER_VAPID_PUBLIC_KEY:-}"
      PERIOD_TRACKER_VAPID_PRIVATE_KEY: "${PERIOD_TRACKER_VAPID_PRIVATE_KEY:-}"
      PERIOD_TRACKER_VAPID_SUBJECT: "${PERIOD_TRACKER_VAPID_SUBJECT:-}"
    volumes:
      - luna-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LUNA_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backup:
    profiles: ["backups"]
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.backup_cli", "schedule"]
    environment:
      PERIOD_TRACKER_DB: /app/data/period_tracker.db
      PERIOD_TRACKER_BACKUP_DIR: /app/backups
      PERIOD_TRACKER_BACKUP_KEY: "${PERIOD_TRACKER_BACKUP_KEY:-}"
      PERIOD_TRACKER_BACKUP_INTERVAL_HOURS: "${PERIOD_TRACKER_BACKUP_INTERVAL_HOURS:-24}"
      PERIOD_TRACKER_BACKUP_RETENTION_DAYS: "${PERIOD_TRACKER_BACKUP_RETENTION_DAYS:-30}"
      PERIOD_TRACKER_BACKUP_MIN_FILES: "${PERIOD_TRACKER_BACKUP_MIN_FILES:-3}"
    volumes:
      - luna-data:/app/data:ro
      - luna-backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-m", "app.backup_cli", "status"]
      interval: 30m
      timeout: 30s
      retries: 2
      start_period: 30s

  notifications:
    profiles: ["notifications"]
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.notification_cli", "schedule"]
    environment:
      PERIOD_TRACKER_DB: /app/data/period_tracker.db
      PERIOD_TRACKER_VAPID_PUBLIC_KEY: "${PERIOD_TRACKER_VAPID_PUBLIC_KEY:-}"
      PERIOD_TRACKER_VAPID_PRIVATE_KEY: "${PERIOD_TRACKER_VAPID_PRIVATE_KEY:-}"
      PERIOD_TRACKER_VAPID_SUBJECT: "${PERIOD_TRACKER_VAPID_SUBJECT:-}"
      PERIOD_TRACKER_NOTIFICATION_INTERVAL_SECONDS: "${PERIOD_TRACKER_NOTIFICATION_INTERVAL_SECONDS:-300}"
    volumes:
      - luna-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.notification_cli", "status"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 20s

  recovery:
    profiles: ["recovery"]
    build:
      context: ./backend
    restart: "no"
    init: true
    command: ["python", "-m", "app.backup_cli", "--help"]
    environment:
      PERIOD_TRACKER_DB: /app/data/period_tracker.db
      PERIOD_TRACKER_BACKUP_DIR: /app/backups
      PERIOD_TRACKER_BACKUP_KEY: "${PERIOD_TRACKER_BACKUP_KEY:-}"
    volumes:
      - luna-data:/app/data
      - luna-backups:/app/backups

volumes:
  luna-data:
  luna-backups:
